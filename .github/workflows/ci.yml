name: DevOps Task Manager CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      DB_NAME: taskdb
      DB_USER: taskuser
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t devops-task-manager-backend ./backend

      - name: Build frontend image
        run: docker build -t devops-task-manager-frontend ./frontend

      - name: Validate Docker Compose
        run: docker compose config
