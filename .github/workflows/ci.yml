name: DevOps Task Manager CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: CI - Build and Test
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      DB_NAME: taskdb
      DB_USER: taskuser
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t devops-task-manager-backend ./backend

      - name: Build frontend image
        run: docker build -t devops-task-manager-frontend ./frontend

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start application
        run: docker compose up -d --build

      - name: Check running containers
        run: docker compose ps

      - name: Test backend health
        run: curl --fail http://localhost:5000/api/health

      - name: Test tasks API through frontend
        run: curl --fail http://localhost:8081/api/tasks

      - name: Stop application
        if: always()
        run: docker compose down -v

  deploy:
    name: CD - Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-task-manager
            git pull origin master
            docker compose up -d --build
            docker compose ps
            curl --fail http://localhost:5000/api/health
